name: 更新弹窗广告列表

on:
  schedule:
    - cron: "23 20 * * *"  # 每天北京时间 04:23
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/update_popupads.py
      - name: 有变化就提交
        run: |
          git diff --quiet rules/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/
          git commit -m "chore: update hagezi popup ads list"
          git push
