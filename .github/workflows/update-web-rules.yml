name: 更新网页规则

on:
  schedule:
    - cron: "23 20 * * *"  # 每天北京时间 04:23
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 弹窗广告列表（HaGeZi）
        run: python3 tools/update_popupads.py
      - name: 网页脚本（AdGuard 元素隐藏规则）
        run: python3 tools/build_web.py
      - name: 有变化就提交
        run: |
          git add rules/ scripts/web/inject.js web-popups.sgmodule
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update web rules"
          git push
